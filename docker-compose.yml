services:
  app:
    image: etherpad/etherpad:latest
    container_name: etherpad_app
    user: "0:0"
    tty: true
    stdin_open: true
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - plugins:/opt/etherpad-lite/src/plugin_packages
      - etherpad-var:/opt/etherpad-lite/var
    environment:
      NODE_ENV: production
      PAD_OPTIONS_LANG: "pt-br"
      ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:?Defina APP_ADMIN_PASSWORD no .env}"
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_NAME: ${POSTGRES_DATABASE:-etherpad}
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASS: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}"
      DB_CHARSET: ${APP_DB_CHARSET:-utf8mb4}
      DEFAULT_PAD_TEXT: ${APP_DEFAULT_PAD_TEXT:-}
      DISABLE_IP_LOGGING: ${APP_DISABLE_IP_LOGGING:-false}
      SOFFICE: ${APP_SOFFICE:-null}
      TRUST_PROXY: ${APP_TRUST_PROXY:-false}
    ports:
      - "${APP_PORT_PUBLISHED:-9001}:${APP_PORT_TARGET:-9001}"
    networks:
      - etherpad-net

  postgres:
    image: postgres:15-alpine
    container_name: etherpad_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-etherpad}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DATABASE:-etherpad}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etherpad-net
    # ports:
    #   - "5432:5432"   # descomenta só se precisares de acesso externo

volumes:
  postgres_data:
  plugins:
  etherpad-var:

networks:
  etherpad-net:
    driver: bridge